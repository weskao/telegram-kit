[project]
name = "telegram-kit"
version = "0.1.1"
description = "Secure Telegram Bot API notifications for any Python project. Stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_kit"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]
