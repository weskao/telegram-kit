[project]
name = "telegram-kit"
dynamic = ["version"]
description = "Secure Telegram Bot API notifications for any Python project. Stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/telegram_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_kit"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff.lint]
# On top of ruff's default set: import order, pyupgrade, and two bug-catching B rules.
extend-select = ["I", "UP", "B023", "B904"]
