name: Release

# PyPI Trusted Publishing binds to this filename: keep it `release.yml` in every repo.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check, test, and build
        run: |
          uv run ruff check .
          uv run python -m unittest discover -s tests -t .
          uv build
      - name: Validate release wheel
        run: |
          uv venv .release-venv
          uv pip install --python .release-venv/bin/python --no-index dist/*.whl
          reported="$(.release-venv/bin/python -I -c 'import importlib.metadata as m; print(m.version("telegram-kit"))')"
          if [ "$reported" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::wheel reports '$reported', expected '${GITHUB_REF_NAME#v}'"
            exit 1
          fi
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      # After publish: uv publish uploads dist/*, and SHA256SUMS is not a distribution.
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/$GITHUB_REF_NAME" >/dev/null
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
          fi
